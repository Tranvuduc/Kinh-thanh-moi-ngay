</head>
<body>

    <nav class="topnav">

<main id="main">
  <p class="loading">Đang tải…</p>
</main>

<nav class="tabbar" aria-label="Điều hướng">
  <a href="index.html"><span class="tico">🏠</span>Trang chủ</a>
  <a href="doc.html"><span class="tico">📜</span>Đọc</a>
  <a href="tim-kiem.html"><span class="tico">🔎</span>Tìm kiếm</a>
  <a href="chu-de.html"><span class="tico">📚</span>Chủ đề</a>
  <a href="danh-dau.html"><span class="tico">🔖</span>Đã lưu</a>
</nav>

<footer class="site-footer">
  <p>Bản Kinh Thánh 1934 (public domain) • Ghi chú AI soạn, chưa được mục sư duyệt</p>
  <p>Soli Deo Gloria</p>
</footer>

<script src="app.js" defer></script>
<script defer>
document.addEventListener('DOMContentLoaded', function () {
  HKT.initTheme();
  var main = document.getElementById('main');
  var books = null, people = null, bookData = {};
  var q = new URLSearchParams(window.location.search);
  var pid = q.get('p');

  Promise.all([HKT.loadBooks(), HKT.loadJSON('data/nhanvat.json')])
    .then(function (res) {
      books = res[0]; people = res[1] || [];
      var p = people.find(function (x) { return x.id === pid; });
      if (p) renderDetail(p);
      else renderList();
    })
    .catch(function () { main.innerHTML = '<p>Không tải được dữ liệu.</p>'; });

  function renderList() {
    var html = '<h1 class="chapter-head">👤 Nhân vật Kinh Thánh</h1>' +
      '<p class="muted" style="text-align:center;margin-top:-0.6rem">' + people.length + ' nhân vật — học qua đời sống họ</p>' +
      '<div class="search-box"><input id="nq" type="search" placeholder="Tìm nhân vật…" aria-label="Tìm nhân vật"></div>' +
      '<div id="nlist" class="nav-grid"></div>' +
      '<div class="btn-row"><a class="btn small secondary" href="thu-vien.html">← Thư viện</a></div>';
    main.innerHTML = html;
    document.getElementById('nq').addEventListener('input', function (e) { draw(e.target.value); });
    draw('');
  }

  function draw(s) {
    var nq = HKT.normalizeVN(s.trim());
    var html = '';
    people.forEach(function (p) {
      if (nq && HKT.normalizeVN(p.name).indexOf(nq) === -1) return;
      html += '<a class="nav-card" href="nhan-vat.html?p=' + esc(p.id) + '">' +
        '<span class="ico">👤</span>' + esc(p.name) + '</a>';
    });
    document.getElementById('nlist').innerHTML = html || '<p class="empty-note">Không tìm thấy.</p>';
  }

  function loadBookData(bookId) {
    if (bookData[bookId]) return Promise.resolve(bookData[bookId]);
    return HKT.loadBook(bookId).then(function (d) { bookData[bookId] = d; return d; });
  }

  function renderDetail(p) {
    document.title = p.name + ' — Kinh Thánh Mỗi Ngày';
    var verses = p.verses || [];
    var need = {};
    verses.forEach(function (v) {
      var k = HKT.keyToIndices(books, v.key);
      if (k.b >= 0) need[books[k.b].id] = 1;
    });
    main.innerHTML = '<p class="loading">Đang tải…</p>';
    Promise.all(Object.keys(need).map(loadBookData)).then(function () {
      var html = '<div class="btn-row" style="margin-bottom:0.4rem">' +
        '<a class="btn small secondary" href="nhan-vat.html">← Nhân vật</a></div>' +
        '<h1 class="chapter-head">' + esc(p.name) + '</h1>' +
        '<section class="card"><p>' + esc(p.bio) + '</p>' +
        '<p class="src">Nguồn: AI soạn, chưa được mục sư duyệt</p></section>' +
        '<h2 style="margin:1.2rem 0 0.4rem">Các câu then chốt</h2>';
      verses.forEach(function (v) {
        var k = HKT.keyToIndices(books, v.key);
        var link = k.b >= 0 ? 'doc.html?b=' + k.b + '&c=' + k.c + '#v' + k.v : '#';
        var text = '';
        if (k.b >= 0) {
          var d = bookData[books[k.b].id];
          var ch = d && d.ch[k.c - 1];
          text = (ch && ch[k.v - 1]) || '';
        }
        html += '<div class="topic-verse">' +
          '<a class="tv-ref" href="' + link + '">' + esc(v.ref || HKT.keyToRef(books, v.key)) + '</a>' +
          (text ? '<p class="tv-text">“' + esc(text) + '”</p>' : '') +
          (v.note ? '<p class="tv-note">' + esc(v.note) + '</p>' : '') + '</div>';
      });
      main.innerHTML = html;
    }).catch(function () { main.innerHTML = '<p>Không tải được nội dung.</p>'; });
  }

  function esc(s) {
    return (s || '').replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
});
</script>
</body>
</html>
