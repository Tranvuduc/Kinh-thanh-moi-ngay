<script src="app.js" defer></script>
<script defer>
document.addEventListener('DOMContentLoaded', function () {
  HKT.initTheme();
  var main = document.getElementById('main');
  HKT.loadJSON('data/creeds.json')
    .then(function (creeds) {
      var html = '<h1 class="chapter-head">📜 Tín điều &amp; tuyên xưng đức tin</h1>' +
        '<p class="muted" style="text-align:center;margin-top:-0.6rem">Di sản đức tin của Hội Thánh — bản dịch mới từ nguyên bản</p>';
      (creeds || []).forEach(function (c) {
        html += '<section class="card"><h3 style="margin-top:0">' + esc(c.title) + '</h3>' +
          (c.intro ? '<p class="muted">' + esc(c.intro) + '</p>' : '') +
          '<ol class="creed-list">' +
          (c.articles || []).map(function (a) {
            return '<li><p class="creed-text">“' + esc(a.t) + '”</p>' +
              (a.note ? '<p class="tv-note">' + esc(a.note) + '</p>' : '') + '</li>';
          }).join('') + '</ol></section>';
      });
      html += '<div class="btn-row"><a class="btn small secondary" href="thu-vien.html">← Thư viện</a></div>' +
        '<p class="src" style="text-align:center">Bản dịch: AI soạn, chưa được mục sư duyệt</p>';
      main.innerHTML = html;
    })
    .catch(function () { main.innerHTML = '<p>Không tải được dữ liệu.</p>'; });

  function esc(s) {
    return (s || '').replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
});
</script>
