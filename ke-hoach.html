<main>
  <h1 style="margin-top:0.4rem">🗓️ Kế hoạch đọc Kinh Thánh</h1>

  <div class="picker" aria-label="Chọn kế hoạch">
    <select id="plan-sel" aria-label="Chọn kế hoạch đọc"></select>
  </div>

  <div class="card">
    <h2>Tiến độ của bạn</h2>

      <div class="progress-label" id="bar-label">Đang tải…</div>
    </div>

      <button class="btn small secondary" id="go-today">⏱️ Đến hôm nay</button>
    </div>
  </div>

  <div id="days"><p class="loading">Đang tải kế hoạch…</p></div>

<script src="app.js" defer></script>
<script defer>
document.addEventListener('DOMContentLoaded', function () {
  HKT.initTheme();
  var PLANS = [
    { id: 'year',   title: 'Cả Kinh Thánh trong 1 năm', file: 'data/kehoach.json',   key: 'hkt-plan',         total: 365, hasToday: true },
    { id: 'nt90',   title: 'Tân Ước trong 90 ngày',      file: 'data/plan-nt90.json',  key: 'hkt-plan-nt90',    total: 90,  hasToday: false },
    { id: 'prov31', title: 'Châm Ngôn trong 31 ngày',    file: 'data/plan-prov31.json', key: 'hkt-plan-prov31', total: 31,  hasToday: false }
  ];
  var SEL_KEY = 'hkt-plan-sel';
  var planSel = document.getElementById('plan-sel');
  var books = null;
  var planCache = {};

  PLANS.forEach(function (p, i) {
    var o = document.createElement('option');
    o.value = String(i);
    o.textContent = p.title;
    planSel.appendChild(o);
  });
  var selIdx = parseInt(HKT.storeGet(SEL_KEY, 0), 10);
  if (!isFinite(selIdx) || selIdx < 0 || selIdx >= PLANS.length) selIdx = 0;
  planSel.value = String(selIdx);
  planSel.addEventListener('change', function () {
    selIdx = parseInt(planSel.value, 10);
    HKT.storeSet(SEL_KEY, selIdx);
    renderPlan();
  });

  HKT.loadBooks().then(function (b) {
    books = b;
    renderPlan();
  }).catch(function () {
    document.getElementById('days').innerHTML =
      '<p>Không tải được kế hoạch đọc. Vui lòng kiểm tra kết nối mạng.</p>';
  });

  function loadPlan(p) {
    if (planCache[p.id]) return Promise.resolve(planCache[p.id]);
    return HKT.loadJSON(p.file).then(function (d) {
      planCache[p.id] = d;
      return d;
    });
  }

  function renderPlan() {
    var p = PLANS[selIdx];
    document.getElementById('days').innerHTML = '<p class="loading">Đang tải kế hoạch…</p>';
    loadPlan(p).then(function (plan) {
      var done = HKT.storeGet(p.key, []);
      if (!Array.isArray(done)) done = [];
      var doneSet = {};
      done.forEach(function (i) { doneSet[i] = true; });

      var doy = HKT.dayOfYear();
      var todayIdx = p.hasToday ? Math.min(doy - 1, p.total - 1) : -1;

      var html = '';
      plan.forEach(function (segs, i) {
        var day = i + 1;
        var segsHtml = segs.map(function (s) {
          return '<a href="doc.html?b=' + s.b + '&c=' + s.c1 + '">' + esc(HKT.fmtSeg(books, s)) + '</a>';
        }).join(' &nbsp;•&nbsp; ');
        var cls = 'plan-day' + (doneSet[i] ? ' done' : '') + (i === todayIdx ? ' today' : '');
        html += '<div class="' + cls + '" id="day-' + day + '">' +
          '<input type="checkbox" class="plan-check" data-day="' + i + '"' +
          (doneSet[i] ? ' checked' : '') + ' aria-label="Đánh dấu đã đọc ngày ' + day + '">' +
          '<span class="num">Ngày ' + day + '</span>' +
          '<span class="segs">' + segsHtml + '</span></div>';
      });
      document.getElementById('days').innerHTML = html;
      updateProgress(p, plan.length);

      document.getElementById('go-today').style.display = p.hasToday ? '' : 'none';
      if (p.hasToday) {
        setTimeout(function () {
          var el = document.getElementById('day-' + (todayIdx + 1));
          if (el) el.scrollIntoView({ block: 'center' });
        }, 100);
      }
    }).catch(function () {
      document.getElementById('days').innerHTML = '<p>Không tải được kế hoạch này.</p>';
    });
  }

  document.getElementById('days').addEventListener('change', function (e) {
    var cb = e.target;
    if (!cb.classList.contains('plan-check')) return;
    var p = PLANS[selIdx];
    var i = parseInt(cb.dataset.day, 10);
    var arr = HKT.storeGet(p.key, []);
    if (!Array.isArray(arr)) arr = [];
    if (cb.checked) { if (arr.indexOf(i) === -1) arr.push(i); }
    else { arr = arr.filter(function (x) { return x !== i; }); }
    HKT.storeSet(p.key, arr);
    var row = document.getElementById('day-' + (i + 1));
    if (row) row.classList.toggle('done', cb.checked);
    updateProgress(p);
  });

  document.getElementById('go-today').addEventListener('click', function () {
    var p = PLANS[selIdx];
    if (!p.hasToday) return;
    var todayIdx = Math.min(HKT.dayOfYear() - 1, p.total - 1);
    var el = document.getElementById('day-' + (todayIdx + 1));
    if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  });

  function updateProgress(p, total) {
    p = p || PLANS[selIdx];
    total = total || p.total;
    var arr = HKT.storeGet(p.key, []);
    if (!Array.isArray(arr)) arr = [];
    var n = arr.length;
    document.getElementById('bar').style.width = (n / total * 100).toFixed(1) + '%';
    document.getElementById('bar-label').textContent =
      'Đã đọc ' + n + ' / ' + total + ' ngày (' + Math.round(n / total * 100) + '%) — ' + p.title;
  }

  function esc(s) {
    return (s || '').replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
});
</script>
</body>
</html>
