<script src="app.js" defer></script>
<script defer>
document.addEventListener('DOMContentLoaded', function () {
  HKT.initTheme();
  var COLLECTIONS = {
    prayers:  { file: 'data/prayers.json',  title: 'Lời cầu nguyện trong Kinh Thánh',  sub: 'Học cầu nguyện qua chính Lời Chúa', back: 'thu-vien.html' },
    parables: { file: 'data/parables.json', title: 'Ẩn dụ của Chúa Giê-xu',              sub: 'Giải nghĩa từng ẩn dụ',            back: 'thu-vien.html' },
    names:    { file: 'data/names.json',     title: 'Danh xưng của Đức Chúa Trời',       sub: 'Học biết Chúa qua từng danh xưng', back: 'thu-vien.html' }
  };
  var main = document.getElementById('main');
  var books = null, bookData = {};
  var q = new URLSearchParams(window.location.search);
  var cid = q.get('c');
  var col = COLLECTIONS[cid];
  if (!col) { main.innerHTML = '<p>Không tìm thấy chuyên đề.</p>'; return; }
  var itemId = q.get('t');

  Promise.all([HKT.loadBooks(), HKT.loadJSON(col.file)])
    .then(function (res) {
      books = res[0];
      var items = res[1] || [];
      var item = items.find(function (x) { return x.id === itemId; });
      if (item) renderDetail(item);
      else renderList(items);
    })
    .catch(function () { main.innerHTML = '<p>Không tải được dữ liệu.</p>'; });

  function renderList(items) {
    document.title = col.title + ' — Kinh Thánh Mỗi Ngày';
    var html = '<h1 class="chapter-head">' + esc(col.title) + '</h1>' +
      '<p class="muted" style="text-align:center;margin-top:-0.6rem">' + esc(col.sub) + '</p>';
    items.forEach(function (t) {
      html += '<a class="card topic-card" href="chuyen-de.html?c=' + esc(cid) + '&t=' + esc(t.id) + '">' +
        '<h3>' + esc(t.title) + '</h3><p>' + esc(t.intro) + '</p>' +
        '<span class="count">' + (t.verses ? t.verses.length : 0) + ' câu Kinh Thánh →</span></a>';
    });
    html += '<div class="btn-row"><a class="btn small secondary" href="' + col.back + '">← Thư viện</a></div>';
    main.innerHTML = html;
  }

  function loadBookData(bookId) {
    if (bookData[bookId]) return Promise.resolve(bookData[bookId]);
    return HKT.loadBook(bookId).then(function (d) { bookData[bookId] = d; return d; });
  }

  function renderDetail(t) {
    document.title = t.title + ' — Kinh Thánh Mỗi Ngày';
    var verses = t.verses || [];
    var need = {};
    verses.forEach(function (v) {
      var k = HKT.keyToIndices(books, v.key);
      if (k.b >= 0) need[books[k.b].id] = 1;
    });
    main.innerHTML = '<p class="loading">Đang tải…</p>';
    Promise.all(Object.keys(need).map(loadBookData)).then(function () {
      var html = '<div class="btn-row" style="margin-bottom:0.4rem">' +
        '<a class="btn small secondary" href="chuyen-de.html?c=' + esc(cid) + '">← ' + esc(col.title) + '</a></div>' +
        '<h1 class="chapter-head">' + esc(t.title) + '</h1>' +
        '<section class="card"><p>' + esc(t.intro) + '</p>' +
        '<p class="src">Nguồn: AI soạn, chưa được mục sư duyệt</p></section>';
      verses.forEach(function (v) {
        var k = HKT.keyToIndices(books, v.key);
        var link = k.b >= 0 ? 'doc.html?b=' + k.b + '&c=' + k.c + '#v' + k.v : '#';
        var text = '';
        if (k.b >= 0) {
          var d = bookData[books[k.b].id];
          var ch = d && d.ch[k.c - 1];
          text = (ch && ch[k.v - 1]) || '';
        }
        html += '<div class="topic-verse">' +
          '<a class="tv-ref" href="' + link + '">' + esc(v.ref || HKT.keyToRef(books, v.key)) + '</a>' +
          (text ? '<p class="tv-text">“' + esc(text) + '”</p>' : '') +
          (v.note ? '<p class="tv-note">' + esc(v.note) + '</p>' : '') + '</div>';
      });
      main.innerHTML = html;
    }).catch(function () { main.innerHTML = '<p>Không tải được nội dung.</p>'; });
  }

  function esc(s) {
    return (s || '').replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
});
</script>
</body>
</html>
