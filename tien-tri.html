<script src="app.js" defer></script>
<script defer>
document.addEventListener('DOMContentLoaded', function () {
  HKT.initTheme();
  var main = document.getElementById('main');
  var books = null, bookData = {};

  Promise.all([HKT.loadBooks(), HKT.loadJSON('data/prophecies.json')])
    .then(function (res) {
      books = res[0];
      render(res[1] || []);
    })
    .catch(function () { main.innerHTML = '<p>Không tải được dữ liệu.</p>'; });

  function loadBookData(bookId) {
    if (bookData[bookId]) return Promise.resolve(bookData[bookId]);
    return HKT.loadBook(bookId).then(function (d) { bookData[bookId] = d; return d; });
  }
  function verseText(key) {
    var k = HKT.keyToIndices(books, key);
    if (k.b < 0) return Promise.resolve('');
    return loadBookData(books[k.b].id).then(function (d) {
      var ch = d.ch[k.c - 1];
      return (ch && ch[k.v - 1]) || '';
    }).catch(function () { return ''; });
  }
  function verseLink(key) {
    var k = HKT.keyToIndices(books, key);
    return k.b >= 0 ? 'doc.html?b=' + k.b + '&c=' + k.c + '#v' + k.v : '#';
  }

  function render(items) {
    var need = {};
    items.forEach(function (it) {
      [it.ot, it.nt].forEach(function (r) {
        if (!r) return;
        var k = HKT.keyToIndices(books, r.key);
        if (k.b >= 0) need[books[k.b].id] = 1;
      });
    });
    main.innerHTML = '<p class="loading">Đang tải…</p>';
    Promise.all(Object.keys(need).map(loadBookData)).then(function () {
      var proms = [];
      items.forEach(function (it) {
        proms.push(
          Promise.all([verseText(it.ot.key), verseText(it.nt.key)]).then(function (tx) {
            return { it: it, otText: tx[0], ntText: tx[1] };
          })
        );
      });
      return Promise.all(proms);
    }).then(function (rows) {
      var html = '<h1 class="chapter-head">🔮 Tiên tri về Đấng Mết-si-a</h1>' +
        '<p class="muted" style="text-align:center;margin-top:-0.6rem">' + rows.length +
        ' lời tiên tri Cựu Ước và sự ứng nghiệm trong Tân Ước</p>';
      rows.forEach(function (r) {
        var it = r.it;
        html += '<section class="card"><h3 style="margin-top:0">' + esc(it.title) + '</h3>' +
          (it.intro ? '<p class="muted">' + esc(it.intro) + '</p>' : '') +
          '<div class="topic-verse"><span class="count">TIÊN TRI</span><br>' +
          '<a class="tv-ref" href="' + verseLink(it.ot.key) + '">' + esc(it.ot.ref) + '</a>' +
          (r.otText ? '<p class="tv-text">“' + esc(r.otText) + '”</p>' : '') + '</div>' +
          '<div class="topic-verse"><span class="count">ỨNG NGHIỆM</span><br>' +
          '<a class="tv-ref" href="' + verseLink(it.nt.key) + '">' + esc(it.nt.ref) + '</a>' +
          (r.ntText ? '<p class="tv-text">“' + esc(r.ntText) + '”</p>' : '') + '</div>' +
          (it.note ? '<p class="tv-note">' + esc(it.note) + '</p>' : '') + '</section>';
      });
      html += '<div class="btn-row"><a class="btn small secondary" href="thu-vien.html">← Thư viện</a></div>' +
        '<p class="src" style="text-align:center">Nguồn: AI soạn, chưa được mục sư duyệt</p>';
      main.innerHTML = html;
    }).catch(function () { main.innerHTML = '<p>Không tải được nội dung.</p>'; });
  }

  function esc(s) {
    return (s || '').replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
});
</script>
