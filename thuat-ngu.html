<script src="app.js" defer></script>
<script defer>
document.addEventListener('DOMContentLoaded', function () {
  HKT.initTheme();
  var main = document.getElementById('main');
  var books = null, terms = null;

  Promise.all([HKT.loadBooks(), HKT.loadJSON('data/glossary.json')])
    .then(function (res) {
      books = res[0]; terms = res[1] || [];
      render();
    })
    .catch(function () { main.innerHTML = '<p>Không tải được dữ liệu.</p>'; });

  function render() {
    var html = '<h1 class="chapter-head">🎓 Thuật ngữ thần học</h1>' +
      '<p class="muted" style="text-align:center;margin-top:-0.6rem">' + terms.length +
      ' thuật ngữ Cải Chánh — tìm không cần dấu</p>' +
      '<div class="search-box"><input id="tq" type="search" placeholder="Tìm thuật ngữ…" aria-label="Tìm thuật ngữ"></div>' +
      '<div id="tlist"></div>' +
      '<div class="btn-row"><a class="btn small secondary" href="thu-vien.html">← Thư viện</a></div>';
    main.innerHTML = html;
    document.getElementById('tq').addEventListener('input', function (e) { draw(e.target.value); });
    draw('');
  }

  function draw(s) {
    var nq = HKT.normalizeVN(s.trim());
    var html = '', n = 0;
    terms.forEach(function (t) {
      if (nq && HKT.normalizeVN(t.term).indexOf(nq) === -1) return;
      if (++n > 60) return;
      var refs = (t.verses || []).map(function (r) {
        var k = HKT.keyToIndices(books, r.key);
        var link = k.b >= 0 ? 'doc.html?b=' + k.b + '&c=' + k.c + '#v' + k.v : '#';
        return '<a class="tv-ref" style="font-size:0.9rem;margin-right:0.6rem" href="' + link + '">' +
          esc(r.ref || HKT.keyToRef(books, r.key)) + '</a>';
      }).join('');
      html += '<details class="card strong-entry" style="margin:0.6rem 0"><summary>' +
        '<span class="strong-word">' + esc(t.term) + '</span></summary>' +
        '<p>' + esc(t.def) + '</p>' +
        (refs ? '<p style="margin-top:0.5rem">' + refs + '</p>' : '') + '</details>';
    });
    document.getElementById('tlist').innerHTML = html ||
      '<p class="empty-note">Không tìm thấy. Thử từ khác.</p>';
  }

  function esc(s) {
    return (s || '').replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
});
</script>
