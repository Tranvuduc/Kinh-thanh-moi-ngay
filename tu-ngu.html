<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <span class="brand"><a href="index.html">✝️ Kinh Thánh Mỗi Ngày</a></span>
    <nav class="topnav">
      <a href="doc.html">Đọc</a>

    </nav>
    <button class="theme-toggle" aria-label="Đổi giao diện sáng/tối"><span class="theme-label">🌙 Tối</span></button>
  </div>
</header>

<main id="main">
  <p class="loading">Đang tải…</p>
</main>

<nav class="tabbar" aria-label="Điều hướng">
  <a href="index.html"><span class="tico">🏠</span>Trang chủ</a>
  <a href="doc.html"><span class="tico">📜</span>Đọc</a>
  <a href="tim-kiem.html"><span class="tico">🔎</span>Tìm kiếm</a>
  <a href="chu-de.html"><span class="tico">📚</span>Chủ đề</a>
  <a href="danh-dau.html"><span class="tico">🔖</span>Đã lưu</a>
</nav>

<footer class="site-footer">
  <p>Bản Kinh Thánh 1934 (public domain) • Ghi chú AI soạn, chưa được mục sư duyệt</p>
  <p>Số Strong tham khảo • Soli Deo Gloria</p>
</footer>

<script src="app.js" defer></script>
<script defer>
document.addEventListener('DOMContentLoaded', function () {
  HKT.initTheme();
  var main = document.getElementById('main');
  var books = null, terms = null, bookData = {};
  var langFilter = 'all';

  Promise.all([HKT.loadBooks(), HKT.loadJSON('data/strong.json')])
    .then(function (res) {
      books = res[0];
      terms = res[1] || [];
      var q = new URLSearchParams(window.location.search);
      var s = q.get('s');
      var t = terms.find(function (x) { return x.strong === s; });
      if (t) renderDetail(t);
      else renderList();
    })
    .catch(function () {
      main.innerHTML = '<p>Không tải được từ điển. Vui lòng kiểm tra kết nối mạng.</p>';
    });

  function renderList() {
    var html = '<h1 class="chapter-head">🔤 Từ điển nguyên ngữ</h1>' +
      '<p class="muted" style="text-align:center;margin-top:-0.6rem">Các từ khóa Hy Lạp &amp; Hê-bơ-rơ trong Kinh Thánh</p>' +
      '<div class="search-box"><input id="tq" type="search" placeholder="Tìm: yêu thương, agape, G26…" aria-label="Tìm từ"></div>' +
      '<div class="saved-tabs" role="tablist">' +
      '<button data-lang="all" class="on">Tất cả</button>' +
      '<button data-lang="greek">Hy Lạp</button>' +
      '<button data-lang="hebrew">Hê-bơ-rơ</button>' +
      '</div>' +
      '<div id="tlist"></div>' +
      '<p class="src" style="margin-top:1rem">Số Strong chỉ mang tính tham khảo học thuật.</p>';
    main.innerHTML = html;
    document.querySelectorAll('.saved-tabs button').forEach(function (b) {
      b.addEventListener('click', function () {
        document.querySelectorAll('.saved-tabs button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        langFilter = b.dataset.lang;
        drawList(document.getElementById('tq').value);
      });
    });
    document.getElementById('tq').addEventListener('input', function (e) {
      drawList(e.target.value);
    });
    drawList('');
  }

  function drawList(q) {
    var nq = HKT.normalizeVN(q.trim());
    var html = '';
    var n = 0;
    terms.forEach(function (t) {
      if (langFilter !== 'all' && t.lang !== langFilter) return;
      if (nq) {
        var hay = HKT.normalizeVN([t.vn, t.translit, t.strong, t.word].join(' '));
        if (hay.indexOf(nq) === -1) return;
      }
      n++;
      html += '<a class="card topic-card" style="margin:0.6rem 0" href="tu-ngu.html?s=' + esc(t.strong) + '">' +
        '<div style="display:flex;align-items:baseline;gap:0.6rem">' +
        '<span style="font-size:1.5rem">' + esc(t.word) + '</span>' +
        '<span class="count">' + esc(t.strong) + '</span></div>' +
        '<h3 style="margin:0.2rem 0">' + esc(t.vn) + ' <span class="muted" style="font-weight:400">(' + esc(t.translit) + ')</span></h3>' +
        '</a>';
    });
    document.getElementById('tlist').innerHTML =
      html || '<p class="empty-note">Không tìm thấy từ nào.</p>';
  }

  function loadBookData(bookId) {
    if (bookData[bookId]) return Promise.resolve(bookData[bookId]);
    return HKT.loadBook(bookId).then(function (d) {
      bookData[bookId] = d;
      return d;
    });
  }

  function renderDetail(t) {
    document.title = t.vn + ' (' + t.strong + ') — Kinh Thánh Mỗi Ngày';
    var verses = t.verses || [];
    var need = {};
    verses.forEach(function (key) {
      var k = HKT.keyToIndices(books, key);
      if (k.b >= 0) need[books[k.b].id] = 1;
    });
    main.innerHTML = '<p class="loading">Đang tải…</p>';
    Promise.all(Object.keys(need).map(loadBookData)).then(function () {
      var langName = t.lang === 'greek' ? 'Hy Lạp' : 'Hê-bơ-rơ';
      var html = '<div class="btn-row" style="margin-bottom:0.4rem">' +
        '<a class="btn small secondary" href="tu-ngu.html">← Từ điển</a></div>' +
        '<section class="card" style="text-align:center">' +
        '<div style="font-size:2.6rem;margin-bottom:0.3rem">' + esc(t.word) + '</div>' +
        '<h1 class="chapter-head" style="margin:0.2rem 0">' + esc(t.vn) + '</h1>' +
        '<p class="muted">' + esc(t.translit) + ' • ' + langName + ' • <b>' + esc(t.strong) + '</b>' +
        (t.pos ? ' • ' + esc(t.pos) : '') + '</p></section>' +
        '<section class="card"><h2>Giải nghĩa</h2><p>' + esc(t.def) + '</p>' +
        '<p class="src">Nguồn: AI soạn, chưa được mục sư duyệt • Số Strong tham khảo</p></section>';
      if (verses.length) {
        html += '<h2 style="margin:1.2rem 0 0.4rem">Các câu then chốt</h2>';
        verses.forEach(function (key) {
          var k = HKT.keyToIndices(books, key);
          var link = k.b >= 0 ? 'doc.html?b=' + k.b + '&c=' + k.c + '#v' + k.v : '#';
          var text = '';
          if (k.b >= 0) {
            var d = bookData[books[k.b].id];
            var ch = d && d.ch[k.c - 1];
            text = (ch && ch[k.v - 1]) || '';
          }
          html += '<div class="topic-verse">' +
            '<a class="tv-ref" href="' + link + '">' + esc(HKT.keyToRef(books, key)) + '</a>' +
            (text ? '<p class="tv-text">“' + esc(text) + '”</p>' : '') + '</div>';
        });
      }
      main.innerHTML = html;
    }).catch(function () {
      main.innerHTML = '<p>Không tải được nội dung.</p>';
    });
  }

  function esc(s) {
    return (s || '').replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
});
</script>
</body>
</html>
