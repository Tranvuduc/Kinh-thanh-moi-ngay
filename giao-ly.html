<script src="app.js" defer></script>
<script defer>
document.addEventListener('DOMContentLoaded', function () {
  HKT.initTheme();
  var main = document.getElementById('main');
  var books = null, qa = null;

  Promise.all([HKT.loadBooks(), HKT.loadJSON('data/giaoly.json')])
    .then(function (res) {
      books = res[0]; qa = res[1] || [];
      render();
    })
    .catch(function () { main.innerHTML = '<p>Không tải được dữ liệu.</p>'; });

  function render() {
    var html = '<h1 class="chapter-head">❓ Giáo lý vấn đáp Westminster</h1>' +
      '<p class="muted" style="text-align:center;margin-top:-0.6rem">107 câu hỏi &amp; đáp — Hội nghị Westminster 1647</p>' +
      '<p class="muted" style="text-align:center;font-size:0.85rem">Bản dịch mới từ nguyên bản 1647. Câu 95 giữ lập trường báp-têm trẻ em của Westminster — anh em Báp-têm Cải Chánh có quan điểm khác.</p>' +
      '<div class="search-box"><input id="gq" type="search" placeholder="Tìm câu hỏi…" aria-label="Tìm câu hỏi"></div>' +
      '<div id="glist"></div>' +
      '<div class="btn-row"><a class="btn small secondary" href="thu-vien.html">← Thư viện</a></div>';
    main.innerHTML = html;
    document.getElementById('gq').addEventListener('input', function (e) { draw(e.target.value); });
    draw('');
  }

  function draw(q) {
    var nq = HKT.normalizeVN(q.trim());
    var html = '';
    qa.forEach(function (item) {
      if (nq) {
        var hay = HKT.normalizeVN(item.q + ' ' + item.a);
        if (hay.indexOf(nq) === -1) return;
      }
      var refs = (item.refs || []).map(function (r) {
        var k = HKT.keyToIndices(books, r.key);
        var link = k.b >= 0 ? 'doc.html?b=' + k.b + '&c=' + k.c + '#v' + k.v : '#';
        return '<a class="tv-ref" style="font-size:0.9rem;margin-right:0.6rem" href="' + link + '">' +
          esc(r.ref || HKT.keyToRef(books, r.key)) + '</a>';
      }).join('');
      html += '<details class="card note-sec" style="margin:0.6rem 0">' +
        '<summary><span class="count" style="min-width:2.2rem">Câu ' + item.n + '</span> ' + esc(item.q) + '</summary>' +
        '<div class="note-sec-body"><p>' + esc(item.a) + '</p>' +
        (refs ? '<p style="margin-top:0.5rem">' + refs + '</p>' : '') + '</div></details>';
    });
    document.getElementById('glist').innerHTML = html || '<p class="empty-note">Không tìm thấy.</p>';
  }

  function esc(s) {
    return (s || '').replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
});
</script>
</body>
</html>
